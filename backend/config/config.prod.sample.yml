server:
  port: 1313 # The port number your backend server will run on

database:
  uri: "mongodb+srv://<username>:<password>@<cluster-url>/<database-name>"
  # Replace with your MongoDB Atlas connection string
  # Get this from your MongoDB Atlas dashboard after creating a cluster and database

gemini:
  apiKey:
    "<YOUR_GEMINI_API_KEY>"
    # API key for the Gemini client
    # Obtain it from the Gemini provider's credential console

llm:
  # AI providers, tried in this order. Providers without an API key are
  # skipped, and a provider that hits its rate limit (HTTP 429) is skipped
  # for a cool-down so the next one answers. Every provider is called through
  # the OpenAI-compatible API. Each value can also be set with the
  # environment variable named in the comment.
  providers: "groq,cloudflare,mistral,openrouter,gemini" # LLM_PROVIDERS

  groq: # https://console.groq.com/keys (free, no card)
    apiKey: "<YOUR_GROQ_API_KEY>" # GROQ_API_KEY
    chatModel: "openai/gpt-oss-20b" # GROQ_CHAT_MODEL: bot replies
    judgeModel: "openai/gpt-oss-120b" # GROQ_JUDGE_MODEL: judging and evaluation

  cloudflare: # Workers AI, 10,000 free neurons a day
    accountId: "<YOUR_CLOUDFLARE_ACCOUNT_ID>" # CLOUDFLARE_ACCOUNT_ID
    apiKey: "<YOUR_CLOUDFLARE_API_TOKEN>" # CLOUDFLARE_API_TOKEN (Workers AI permission)
    chatModel: "@cf/openai/gpt-oss-20b" # CLOUDFLARE_CHAT_MODEL
    judgeModel: "@cf/openai/gpt-oss-120b" # CLOUDFLARE_JUDGE_MODEL

  mistral:
    apiKey: "<YOUR_MISTRAL_API_KEY>" # MISTRAL_API_KEY
    chatModel: "mistral-small-latest" # MISTRAL_CHAT_MODEL
    judgeModel: "mistral-medium-latest" # MISTRAL_JUDGE_MODEL

  openrouter:
    apiKey: "<YOUR_OPENROUTER_API_KEY>" # OPENROUTER_API_KEY
    chatModel: "openai/gpt-oss-20b:free" # OPENROUTER_CHAT_MODEL
    judgeModel: "openai/gpt-oss-120b:free" # OPENROUTER_JUDGE_MODEL

  gemini: # uses gemini.apiKey above
    chatModel: "gemini-3.6-flash" # GEMINI_CHAT_MODEL
    judgeModel: "gemini-3.6-flash" # GEMINI_JUDGE_MODEL

jwt:
  secret: "<YOUR_JWT_SECRET>"
  # A secret string used to sign JWT tokens
  # Generate a strong random string (e.g. use `openssl rand -hex 32`)

  expiry: 1440
  # Token expiry time in minutes (e.g. 1440 = 24 hours)

smtp:
  host: "smtp.gmail.com"
  # SMTP server host for sending emails (example is Gmail SMTP)

  port: 587
  # SMTP server port (587 for TLS)

  username: "<YOUR_EMAIL_ADDRESS>"
  # Email username (your email address)

  password: "<YOUR_EMAIL_PASSWORD_OR_APP_PASSWORD>"
  # Password for the email or app-specific password if 2FA is enabled

  senderEmail: "<YOUR_EMAIL_ADDRESS>"
  # The 'from' email address used when sending mails

  senderName: "DebateAI Team"

googleOAuth:
  clientID: "<YOUR_GOOGLE_OAUTH_CLIENT_ID>"
  # Google OAuth Client ID for OAuth login
  # Obtain from Google Cloud Console (APIs & Services > Credentials > OAuth 2.0 Client IDs)

redis:
  addr: "localhost:6379"
  password: "<YOUR_REDIS_PASSWORD>"
  db: 0
